<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    font-size: 12px;
    color: #1a1a1a;
    background: #fff;
  }
  /* min-height (not a fixed height) lets the panel grow taller than the
     window and scroll naturally, instead of squeezing #results down to
     zero height when the guide text doesn't fit at once. */
  .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
  h2 { font-size: 13px; margin: 0 0 2px; }
  .guide {
    background: #f8f8f8;
    border-radius: 8px;
    padding: 10px 12px;
    color: #444;
    line-height: 1.6;
  }
  .guide ol { margin: 0; padding-left: 18px; }
  .guide .note { margin: 8px 0 0; color: #999; font-size: 11px; }
  .file-link { font-size: 11px; }
  .file-link a { color: #18a0fb; text-decoration: none; }
  .file-link a:hover { text-decoration: underline; }
  .row { display: flex; gap: 8px; }
  button {
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  button.primary { background: #18a0fb; color: #fff; flex: 1; }
  button.primary:hover { background: #0d8ee0; }
  button.secondary { background: #f0f0f0; color: #333; }
  button.secondary:hover { background: #e4e4e4; }
  #results { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .card {
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 8px;
  }
  .card h3 { font-size: 12px; margin: 0 0 6px; }
  textarea.output {
    width: 100%;
    height: 160px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
  }
  .error { color: #c53030; }
  .empty { color: #999; text-align: center; padding: 24px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h2>Template → HTML</h2>
    <div class="guide">
      <ol>
        <li>선택한 템플릿을 코드로 변환합니다.</li>
        <li>레이어 명, 컬러 등 slot 외 임의 변경 시 코드가 제대로 작동하지 않을 수 있습니다.</li>
        <li>이미지는 임시 자리만 표시되고 실제로 변환되지 않습니다. (카페24 에디터를 통해 이미지 직접 교체)</li>
        <li>복사 버튼을 눌러 카페24 상품에 붙여 넣으세요!</li>
      </ol>
      <p class="note">*파일 이상 시 디자인팀 요청</p>
    </div>
    <p class="file-link">
      <a href="https://github.com/dwdodo/dodocloud/blob/claude/figma-template-html-plugin-fnaurc/figma-template-html-plugin/production-template.html" target="_blank" rel="noopener">템플릿 코드 보러가기 ↗</a>
    </p>
  </div>

  <div class="row">
    <button class="primary" id="convert-btn">변환하기</button>
  </div>

  <div id="results">
    <div class="empty" id="empty-msg">아직 변환 결과가 없습니다.</div>
  </div>
</div>

<script>
  // The HTML structure marketing converts into. Fixed/baked-in rather than
  // editable in this UI - if the page structure itself needs to change,
  // that's a design/dev task (edit this constant + production-template.html
  // in the repo, which the "템플릿 코드 보러가기" link above points to).
  //
  // Deliberately has NO <style> block: the CSS for .page/.benefit-list/
  // .menu-item/etc. already lives in Cafe24's own shell page around this
  // content, so embedding it here would just be redundant/conflicting.
  // The only <style> this plugin ever injects is the dynamic .fx-N block
  // (see styleBlockFor) for actual per-run text customization pulled from
  // Figma - that can't be known ahead of time, so it isn't static CSS.
  var DEFAULT_TEMPLATE = [
    '<!DOCTYPE html>',
    '<html lang="ko">',
    '<head>',
    '<meta charset="UTF-8" />',
    '<title>Club Movement Benefit</title>',
    '</head>',
    '<body>',
    '  <div class="page">',
    '',
    '    <!-- 혜택 섹션: Figma 최상위 프레임 이름 "혜택" -->',
    '    <section class="section">',
    '      <div class="titWrap">',
    '        <h4 data-figma-slot="title:혜택.소제목"></h4>',
    '        <h2 data-figma-slot="title:혜택.대제목"></h2>',
    '      </div>',
    '',
    '      <!-- Figma 레이어 "Repeat- 혜택리스트" -->',
    '      <div class="benefit-list" data-figma-repeat="혜택리스트">',
    '        <div class="benefit-item">',
    '          <div data-figma-slot="title"></div>',
    '          <div data-figma-slot="body" data-figma-format="blocks"></div>',
    '        </div>',
    '      </div>',
    '',
    '      <!-- Figma 레이어 "Repeat- 안내사항리스트" -->',
    '      <div class="notice-list" data-figma-repeat="안내사항리스트">',
    '        <div class="notice-item">',
    '          <strong data-figma-slot="title"></strong>',
    '          <div data-figma-slot="body" data-figma-format="blocks"></div>',
    '        </div>',
    '      </div>',
    '    </section>',
    '',
    '    <!-- 소개 섹션: Figma 최상위 프레임 이름 "소개" -->',
    '    <section class="section">',
    '      <div class="titWrap">',
    '        <h4 data-figma-slot="title:소개.소제목"></h4>',
    '        <h2 data-figma-slot="title:소개.대제목"></h2>',
    '      </div>',
    '',
    '      <!-- Figma 레이어 "Repeat-그룹": 텍스트/이미지가 순서 상관없이 자유롭게 섞여 있음 -->',
    '      <div data-figma-repeat="그룹">',
    '        <div class="about-text" data-figma-repeat-type="text"  data-figma-slot="body" data-figma-format="blocks"></div>',
    '        <img class="about-image" data-figma-repeat-type="image" data-figma-slot="image" src="" alt="" />',
    '      </div>',
    '    </section>',
    '',
    '    <!-- 메뉴 섹션: Figma 최상위 프레임 이름 "메뉴" -->',
    '    <section class="section">',
    '      <div class="titWrap">',
    '        <h4 data-figma-slot="title:메뉴.소제목"></h4>',
    '        <h2 data-figma-slot="title:메뉴.대제목"></h2>',
    '      </div>',
    '',
    '      <!-- Figma 레이어 "Repeat- 메뉴리스트" -->',
    '      <div data-figma-repeat="메뉴리스트">',
    '        <div class="menu-item">',
    '          <img data-figma-slot="image" src="" alt="" />',
    '          <div class="menu-info">',
    '            <h3 data-figma-slot="title"></h3>',
    '            <div data-figma-slot="body" data-figma-format="blocks"></div>',
    '          </div>',
    '        </div>',
    '      </div>',
    '    </section>',
    '',
    '  </div>',
    '</body>',
    '</html>'
  ].join('\n');

  // Figma font sizes always snap to the nearest value in this list, so
  // output text only ever uses an approved size. Edit here (and note the
  // change in the repo's README) if the design system's scale changes.
  var ALLOWED_SIZES = [14, 16, 20, 24, 32, 40];

  var resultsEl = document.getElementById('results');
  var emptyMsg = document.getElementById('empty-msg');

  document.getElementById('convert-btn').addEventListener('click', function () {
    console.log('[ui] convert button clicked, sending message to plugin');
    parent.postMessage({ pluginMessage: { type: 'convert' } }, '*');
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Snaps a raw Figma font size to whichever allowed size is numerically
  // closest, so output text only ever uses sizes the user has approved.
  function snapFontSize(size, allowedSizes) {
    if (!allowedSizes || allowedSizes.length === 0) return size;
    var closest = allowedSizes[0];
    var minDiff = Math.abs(size - closest);
    for (var i = 1; i < allowedSizes.length; i++) {
      var diff = Math.abs(size - allowedSizes[i]);
      if (diff < minDiff) {
        minDiff = diff;
        closest = allowedSizes[i];
      }
    }
    return closest;
  }

  // Collects the distinct (font-size + color) combinations used across one
  // conversion, so they can be emitted once as CSS classes in a single
  // <style> block instead of repeating inline styles on every <span>.
  function createStyleCollector() {
    return { map: {}, order: [] };
  }

  function classForDeclarations(collector, declarations) {
    var cssText = declarations.join(';');
    if (collector.map[cssText]) return collector.map[cssText];
    var className = 'fx-' + (collector.order.length + 1);
    collector.map[cssText] = className;
    collector.order.push({ className: className, css: cssText });
    return className;
  }

  function styleBlockFor(collector) {
    if (collector.order.length === 0) return '';
    return collector.order
      .map(function (c) { return '.' + c.className + '{' + c.css + '}'; })
      .join('\n');
  }

  // Renders Figma style runs (from getStyledTextSegments) as HTML, wrapping
  // each run in a <span class="fx-N"> (rather than an inline style) whose
  // rule carries its (snapped) font-size and real color. Line breaks within
  // a run are preserved as <br>.
  function runsToHtml(runs, allowedSizes, collector) {
    if (!runs || runs.length === 0) return '';
    return runs
      .map(function (run) {
        var declarations = [];
        if (typeof run.fontSize === 'number') {
          declarations.push('font-size:' + snapFontSize(run.fontSize, allowedSizes) + 'px');
        }
        if (run.color) declarations.push('color:' + run.color);

        var text = escapeHtml(run.text || '').split('\n').join('<br>');
        if (declarations.length === 0) return text;
        var className = classForDeclarations(collector, declarations);
        return '<span class="' + className + '">' + text + '</span>';
      })
      .join('');
  }

  // Splits raw text (as typed into ONE Figma text layer, no extra layers
  // needed) into blocks: a "heading + bullet list" block wherever a run of
  // one-or-more bullet-marked lines appears (optionally preceded directly,
  // with no blank line, by one heading line), and plain paragraph text
  // everywhere else. Blank lines are NOT treated as paragraph separators -
  // they stay inside the surrounding paragraph block and render as <br>
  // (so a spacing blank line becomes a double <br>, matching what the user
  // actually typed) - only a real bullet-list run gets pulled out as its
  // own block. Lets a single body layer contain a main paragraph plus
  // optional labelled bullet lists (e.g. "Tip" / "안내사항") and still come
  // out as real <ul><li> structure instead of flat text.
  var BULLET_RE = /^\s*[•\-\*·]\s*/;
  function parseTextBlocks(text) {
    var lines = String(text || '').split('\n');
    var blocks = [];
    var paraLines = [];

    function flushParagraph() {
      // Trim leading/trailing blank lines - those are just the gap next to
      // a list block or the start/end of the text, not spacing the user
      // meant to see. Blank lines BETWEEN real content lines are kept.
      var start = 0;
      var end = paraLines.length;
      while (start < end && paraLines[start].trim() === '') start++;
      while (end > start && paraLines[end - 1].trim() === '') end--;
      var trimmed = paraLines.slice(start, end);
      paraLines = [];
      if (trimmed.length > 0) blocks.push({ type: 'paragraph', lines: trimmed });
    }

    function takeBulletRun(start) {
      var items = [];
      var j = start;
      while (j < lines.length && lines[j].trim() !== '' && BULLET_RE.test(lines[j])) {
        items.push(lines[j].replace(BULLET_RE, '').trim());
        j++;
      }
      return { items: items, next: j };
    }

    var i = 0;
    while (i < lines.length) {
      var line = lines[i];

      if (line.trim() !== '' && BULLET_RE.test(line)) {
        var bare = takeBulletRun(i);
        flushParagraph();
        blocks.push({ type: 'list', heading: null, items: bare.items });
        i = bare.next;
        continue;
      }

      if (line.trim() !== '' && i + 1 < lines.length && lines[i + 1].trim() !== '' && BULLET_RE.test(lines[i + 1])) {
        var withHeading = takeBulletRun(i + 1);
        flushParagraph();
        blocks.push({ type: 'list', heading: line.trim(), items: withHeading.items });
        i = withHeading.next;
        continue;
      }

      paraLines.push(line);
      i++;
    }
    flushParagraph();
    return blocks;
  }

  function textBlocksToHtml(blocks) {
    return blocks
      .map(function (b) {
        if (b.type === 'list') {
          var heading = b.heading ? '<strong class="fx-block-heading">' + escapeHtml(b.heading) + '</strong>' : '';
          var items = b.items.map(function (it) { return '<li>' + escapeHtml(it) + '</li>'; }).join('');
          return '<div class="fx-block">' + heading + '<ul>' + items + '</ul></div>';
        }
        return '<p class="fx-block">' + b.lines.map(escapeHtml).join('<br>') + '</p>';
      })
      .join('');
  }

  // Fills a title/body slot from style runs when available, falling back
  // to the plain extracted string (e.g. if getStyledTextSegments failed).
  // Either way, line breaks are preserved as <br> - UNLESS the element
  // carries data-figma-format="blocks", in which case the text is parsed
  // into paragraphs/bullet-lists (see parseTextBlocks) instead; that mode
  // is opt-in per element, so it never changes existing simple templates.
  function fillTextSlot(el, plainText, runs, allowedSizes, collector) {
    if (!el) return;
    if (el.getAttribute && el.getAttribute('data-figma-format') === 'blocks') {
      el.innerHTML = textBlocksToHtml(parseTextBlocks(plainText || ''));
      return;
    }
    if (runs && runs.length > 0) {
      el.innerHTML = runsToHtml(runs, allowedSizes, collector);
    } else {
      el.innerHTML = escapeHtml(plainText || '').split('\n').join('<br>');
    }
  }

  // Leaves the actual image out entirely - src="" for <img> (width/height
  // kept as a sizing hint), or just a text label for a non-<img> element -
  // rather than filling in a generated placeholder picture. The real image
  // gets inserted later in whichever editor the HTML ends up in.
  function fillImageSlot(imageEl, imageData) {
    if (!imageEl) return;
    if (imageEl.tagName === 'IMG') {
      imageEl.setAttribute('src', '');
      imageEl.setAttribute('alt', '이미지 자리입니다');
      if (imageData.width) imageEl.setAttribute('width', imageData.width);
      if (imageData.height) imageEl.setAttribute('height', imageData.height);
    } else {
      imageEl.textContent = '이미지 자리입니다 (' + imageData.width + ' × ' + imageData.height + ')';
    }
  }

  // Parses a data-figma-slot value:
  //   "title"                bare - the main/default section
  //   "title:about"          named section "about"
  //   "title.소제목"          the "소제목" sub-part of the main section's title
  //   "title:about.소제목"    the "소제목" sub-part of the "about" section's title
  // "role" or "role: key" is the same convention used for repeat groups;
  // ".part" additionally addresses one individual text layer when a
  // title/body wrapper contains several (e.g. "소제목" + "대제목") and the
  // HTML wants them as separate elements instead of one combined block.
  function parseSlotAttr(value) {
    var m = (value || '').trim().match(/^(title|body|image)(?:\s*[:\-]\s*([^.]*))?(?:\.(.+))?$/i);
    if (!m) return null;
    return {
      role: m[1].toLowerCase(),
      key: (m[2] || '').trim().toLowerCase(),
      part: (m[3] || '').trim().toLowerCase() || null
    };
  }

  // data.slots[""] already holds the same data as the flat data.title/
  // data.body/data.image fields whenever a bare-named layer was found, so
  // this needs no special-casing for the default section - only a safe
  // fallback for a key nothing matched at all.
  function slotDataFor(data, key) {
    if (data.slots && data.slots[key]) return data.slots[key];
    return { title: '', titleRuns: null, titleParts: null, body: '', bodyRuns: null, bodyParts: null, image: { present: false, width: 0, height: 0 } };
  }

  // Resolves the text+runs to actually render for a title/body role,
  // optionally narrowed down to one named sub-part (see parseSlotAttr).
  function textAndRunsFor(slotData, role, part) {
    var textKey = role === 'title' ? 'title' : 'body';
    var runsKey = role === 'title' ? 'titleRuns' : 'bodyRuns';
    var partsKey = role === 'title' ? 'titleParts' : 'bodyParts';
    if (part) {
      var found = slotData[partsKey] && slotData[partsKey][part];
      return found ? { text: found.text, runs: found.runs } : { text: '', runs: null };
    }
    return { text: slotData[textKey], runs: slotData[runsKey] };
  }

  // Fills every [data-figma-slot] found within `root` (inclusive of root
  // itself, so a repeat-item template can be a single slot element with no
  // wrapper). Used for repeat-group items, where `data` IS the item's own
  // title/body/image/*Parts fields directly (no section-key lookup needed).
  function fillSlotsWithin(root, data, allowedSizes, collector) {
    var candidates = root.matches('[data-figma-slot]') ? [root] : [];
    candidates = candidates.concat(Array.prototype.slice.call(root.querySelectorAll('[data-figma-slot]')));

    candidates.forEach(function (el) {
      var parsed = parseSlotAttr(el.getAttribute('data-figma-slot'));
      if (!parsed) return;
      if (parsed.role === 'title' || parsed.role === 'body') {
        var resolved = textAndRunsFor(data, parsed.role, parsed.part);
        fillTextSlot(el, resolved.text, resolved.runs, allowedSizes, collector);
      } else if (parsed.role === 'image' && data.image && data.image.present) {
        fillImageSlot(el, data.image);
      }
    });
  }

  // Fills a repeat container whose authored markup provides one variant
  // child per block TYPE, marked with data-figma-repeat-type="text" /
  // "image", instead of one fixed item template - for a repeat group used
  // as a free-form ORDERED sequence of paragraphs and images (rather than
  // fixed title+body+image items). Renders `blocks` in order, picking the
  // matching variant for each block's type. Returns false (leaving the
  // container's authored markup untouched) if no variant children exist,
  // so this cleanly falls back to the normal single-item-template mode.
  function fillBlockSequence(repeatEl, blocks, allowedSizes, collector) {
    var variants = {};
    Array.prototype.forEach.call(repeatEl.children, function (child) {
      var t = (child.getAttribute('data-figma-repeat-type') || '').trim().toLowerCase();
      if (t) variants[t] = child;
    });
    if (Object.keys(variants).length === 0) return false;

    Object.keys(variants).forEach(function (t) { variants[t] = variants[t].cloneNode(true); });
    repeatEl.innerHTML = '';
    blocks.forEach(function (block) {
      var template = variants[block.type];
      if (!template) return; // no variant authored for this block type - skip rather than guess
      var clone = template.cloneNode(true);
      clone.removeAttribute('data-figma-repeat-type');
      var synthetic = {
        title: block.text || '', titleRuns: block.runs || null, titleParts: null,
        body: block.text || '', bodyRuns: block.runs || null, bodyParts: null,
        image: block.image || { present: false, width: 0, height: 0 }
      };
      fillSlotsWithin(clone, synthetic, allowedSizes, collector);
      repeatEl.appendChild(clone);
    });
    return true;
  }

  function applyTemplate(templateHtml, data, allowedSizes) {
    var doc = new DOMParser().parseFromString(templateHtml, 'text/html');
    var collector = createStyleCollector();

    var slotEls = Array.prototype.filter.call(doc.querySelectorAll('[data-figma-slot]'), function (el) {
      return !el.closest('[data-figma-repeat]');
    });
    slotEls.forEach(function (el) {
      var parsed = parseSlotAttr(el.getAttribute('data-figma-slot'));
      if (!parsed) return;
      var slotData = slotDataFor(data, parsed.key);
      if (parsed.role === 'title' || parsed.role === 'body') {
        var resolved = textAndRunsFor(slotData, parsed.role, parsed.part);
        fillTextSlot(el, resolved.text, resolved.runs, allowedSizes, collector);
      } else if (parsed.role === 'image' && slotData.image && slotData.image.present) {
        fillImageSlot(el, slotData.image);
      }
    });

    var repeatEls = doc.querySelectorAll('[data-figma-repeat]');
    var repeatKeys = data.repeats ? Object.keys(data.repeats) : [];
    // Positional fallback only applies when every repeat slot in the HTML
    // can be paired 1:1, in order, with a repeat group found in Figma —
    // lets `data-figma-repeat` (no value) keep working for a single group,
    // and even for several groups as long as the counts match up.
    var usePositionalFallback = repeatEls.length === repeatKeys.length;

    repeatEls.forEach(function (repeatEl, idx) {
      var attr = (repeatEl.getAttribute('data-figma-repeat') || '').trim().toLowerCase();
      var key = attr || (usePositionalFallback ? repeatKeys[idx] : '');

      // A container authored with data-figma-repeat-type variant children
      // (see fillBlockSequence) is a free-form ordered text/image sequence,
      // not a fixed title+body+image item list - handled separately.
      var blocks = data.repeatBlocks ? data.repeatBlocks[key] : undefined;
      if (blocks && fillBlockSequence(repeatEl, blocks, allowedSizes, collector)) return;

      var items = data.repeats ? data.repeats[key] : undefined;

      // No matching Figma group for this slot: leave the authored markup
      // untouched rather than guessing.
      if (!items || !repeatEl.firstElementChild) return;

      var itemTemplate = repeatEl.firstElementChild.cloneNode(true);
      repeatEl.innerHTML = '';
      items.forEach(function (item) {
        var clone = itemTemplate.cloneNode(true);
        fillSlotsWithin(clone, item, allowedSizes, collector);
        repeatEl.appendChild(clone);
      });
    });

    // Figma-derived font-size/color rules go in one <style> block at the
    // very top of <head>, rather than as inline styles on every span.
    var styleCss = styleBlockFor(collector);
    if (styleCss && doc.head) {
      var styleEl = doc.createElement('style');
      styleEl.textContent = styleCss;
      doc.head.insertBefore(styleEl, doc.head.firstChild);
    }

    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }

  function renderResults(results) {
    resultsEl.innerHTML = '';
    if (!results || results.length === 0) {
      resultsEl.appendChild(emptyMsg);
      return;
    }

    results.forEach(function (data, idx) {
      var card = document.createElement('div');
      card.className = 'card';

      if (data.error) {
        card.innerHTML =
          '<h3>' + escapeHtml(data.name || ('레이어 ' + (idx + 1))) + '</h3>' +
          '<p class="error">변환 실패: ' + escapeHtml(data.error) + '</p>';
        resultsEl.appendChild(card);
        return;
      }

      var outputHtml = applyTemplate(DEFAULT_TEMPLATE, data, ALLOWED_SIZES);

      var header = document.createElement('h3');
      header.textContent = data.name || ('레이어 ' + (idx + 1));
      card.appendChild(header);

      var out = document.createElement('textarea');
      out.className = 'output';
      out.readOnly = true;
      out.value = outputHtml;
      card.appendChild(out);

      var row = document.createElement('div');
      row.className = 'row';

      var copyBtn = document.createElement('button');
      copyBtn.className = 'secondary';
      copyBtn.textContent = '복사';
      copyBtn.addEventListener('click', function () {
        // navigator.clipboard is unavailable inside Figma's plugin UI
        // iframe, so copy via the classic select + execCommand route
        // instead (works reliably in that sandboxed context).
        out.focus();
        out.select();
        out.setSelectionRange(0, out.value.length);
        var ok = false;
        try {
          ok = document.execCommand('copy');
        } catch (e) {
          ok = false;
        }
        copyBtn.textContent = ok ? '복사됨!' : '복사 실패';
        setTimeout(function () { copyBtn.textContent = '복사'; }, 1200);
      });
      row.appendChild(copyBtn);

      card.appendChild(row);
      resultsEl.appendChild(card);
    });
  }

  window.onmessage = function (event) {
    var msg = event.data.pluginMessage;
    console.log('[ui] received message from plugin:', msg);
    if (!msg) return;

    if (msg.type === 'result') {
      renderResults(msg.results);
    } else if (msg.type === 'error') {
      resultsEl.innerHTML = '<p class="error">' + escapeHtml(msg.message) + '</p>';
    }
  };
</script>
</body>
</html>
